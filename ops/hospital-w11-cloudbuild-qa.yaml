# Invoked manually from a checked-out W11 branch; never runs on the EMPROVEX project.
# NEXT_PUBLIC Firebase Web API keys/app IDs identify a Firebase Web app;
# they are client-visible configuration, not service-account secrets.
steps:
  - name: gcr.io/cloud-builders/docker
    id: build-private-hospital-qa-image
    args:
      - build
      - --file
      - ops/Dockerfile.hospital-qa
      - --build-arg
      - NEXT_PUBLIC_HOSPITAL_FIREBASE_API_KEY=${_HOSPITAL_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_HOSPITAL_FIREBASE_APP_ID=${_HOSPITAL_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_HOSPITAL_FIREBASE_PROJECT_ID=cozinha-dietetica
      - --tag
      - southamerica-east1-docker.pkg.dev/cozinha-dietetica/hospital-qa/hospital-web:w11-$BUILD_ID
      - .
images:
  - southamerica-east1-docker.pkg.dev/cozinha-dietetica/hospital-qa/hospital-web:w11-$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
