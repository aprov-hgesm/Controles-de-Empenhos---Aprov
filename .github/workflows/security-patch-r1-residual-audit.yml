# Temporary read-only residual audit diagnostic; remove from final diff.
name: Security Patch R1 residual audit (temporary)
on:
  push:
    branches: [fix/security-patch-r1-20261030]
    paths: [".github/workflows/security-patch-r1-residual-audit.yml"]
permissions:
  contents: read
jobs:
  residual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Print every residual advisory with fix availability
        shell: bash
        run: |
          npm audit --json > /tmp/r1-audit-residual.json || true
          node <<'NODE'
          const j=require('/tmp/r1-audit-residual.json');
          console.log('R1_AUDIT_TOTAL='+JSON.stringify(j.metadata?.vulnerabilities));
          for(const [name,a] of Object.entries(j.vulnerabilities||{})){
            console.log('R1_AUDIT_PACKAGE='+JSON.stringify({
              name, severity:a.severity, range:a.range,
              isDirect:a.isDirect, fixAvailable:a.fixAvailable,
              via:a.via?.map(x=>typeof x==='string'?x:({source:x.source,name:x.name,severity:x.severity,title:x.title,url:x.url,range:x.range}))
            }));
          }
          NODE
      - name: Runtime-dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/r1-audit-runtime.json || true
          node <<'NODE'
          const j=require('/tmp/r1-audit-runtime.json');
          console.log('R1_AUDIT_RUNTIME='+JSON.stringify(j.metadata?.vulnerabilities));
          console.log('R1_AUDIT_RUNTIME_PACKAGES='+JSON.stringify(Object.keys(j.vulnerabilities||{})));
          NODE
