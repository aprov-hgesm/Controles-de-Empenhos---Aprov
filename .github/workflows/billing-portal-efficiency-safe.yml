name: Billing Portal Efficiency Safe Release

on:
  pull_request:
    paths:
      - 'app/api/billing/portal/**'
      - 'lib/server/billingPortalIdentity.ts'
      - 'components/billing/InfinitePayPilotPanel.tsx'
      - 'components/billing/InfinitePayReadinessPanel.tsx'
      - 'scripts/billing-portal-efficiency-audit.test.mjs'
      - 'scripts/billing-portal-identity-concurrency.test.mjs'
      - '.github/workflows/billing-portal-efficiency-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Certified route and identity efficiency
        run: |
          node --test scripts/billing-portal-efficiency-audit.test.mjs scripts/billing-portal-identity-concurrency.test.mjs
          node --test scripts/infinitepay-portal-pilot.test.mjs scripts/billing-workspace-rehydration.test.mjs
      - name: TypeScript verification
        run: npm run typecheck
