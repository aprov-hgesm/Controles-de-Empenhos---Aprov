name: Browser E2E On Demand

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/e2e/warehouse-manual-entry-server.spec.mjs'
      - 'scripts/e2e-browser-emulator.mjs'
      - 'lib/server/warehouseManualEntry.ts'
      - 'lib/server/warehouseFirestoreTransaction.ts'
      - 'app/api/central-depositos/manual-entry/route.ts'
      - '.github/workflows/browser-e2e-on-demand.yml'

permissions:
  contents: read

concurrency:
  group: emprovex-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e-emulator:
    name: Browser E2E with Firebase Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E manual entry (PR, isolated)
        if: github.event_name == 'pull_request'
        run: npx --yes firebase-tools emulators:exec --config firebase.security-test.json --project demo-emprovex-security --only auth,firestore "node scripts/e2e-browser-emulator.mjs tests/e2e/warehouse-manual-entry-server.spec.mjs"

      - name: Browser E2E all scenarios (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e:browser
