# Temporary single-use lockfile generation job. This file removes itself from the branch.
name: Security Patch R1 lockfile regeneration (temporary)
on:
  push:
    branches: [fix/security-patch-r1-20261030]
    paths:
      - ".github/workflows/security-patch-r1-lockfile.yml"
permissions:
  contents: write
concurrency:
  group: security-patch-r1-lockfile
  cancel-in-progress: false
jobs:
  regenerate-lockfile:
    if: github.repository == 'aprov-hgesm/Controles-de-Empenhos---Aprov'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Generate deterministic lockfile (no lifecycle scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile package versions and security floors
        run: |
          node <<'NODE'
          const lock=require('./package-lock.json');
          const root=lock.packages[''];
          if(root.dependencies.next!=='15.5.28')throw Error('Next root mismatch');
          const required={'node_modules/next':'15.5.28','node_modules/undici':'6.29.1','node_modules/dompurify':'3.4.17'};
          for(const [path,version] of Object.entries(required)){
            const p=lock.packages[path];
            if(!p||p.version!==version||!p.integrity)throw Error(path+' does not resolve to '+version);
          }
          for(const [path,pkg] of Object.entries(lock.packages)){
            if((path.endsWith('/undici')&&pkg.version!=='6.29.1')||(path.endsWith('/dompurify')&&pkg.version!=='3.4.17'))throw Error('Unpatched nested package: '+path);
            if(path.endsWith('/sharp')&&pkg.version!=='0.35.5')throw Error('Unexpected Sharp: '+pkg.version);
          }
          console.log('Package resolution and integrity checks PASS');
          NODE
      - name: Verify npm ci from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Record dependency tree
        run: npm ls next undici dompurify sharp --all
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/security-patch-r1-lockfile.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m "fix(security): regenerate npm lockfile for patched dependencies"
          git push origin HEAD:fix/security-patch-r1-20261030
