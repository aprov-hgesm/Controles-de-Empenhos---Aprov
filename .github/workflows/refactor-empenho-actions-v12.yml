name: Temporary empenho actions refactor v12

on:
  push:
    branches:
      - refactor/empenho-actions-v12

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/empenho-actions-v12
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture TypeScript baseline
        shell: bash
        run: |
          (npx tsc --noEmit --pretty false || true) \
            | sed -E 's/\([0-9]+,[0-9]+\)/(L,C)/g' \
            | sed -E 's/"success" \| "error" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"success" \| "info" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"error" \| "success" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "success" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "error" \| "success"/"error" | "info" | "success"/g' \
            | sort -u > /tmp/ts-baseline.txt
      - name: Apply deterministic empenho actions refactor
        run: node scripts/refactor-empenho-actions-v12.mjs
      - name: Verify refactor adds no TypeScript errors
        shell: bash
        run: |
          (npx tsc --noEmit --pretty false || true) \
            | sed -E 's/\([0-9]+,[0-9]+\)/(L,C)/g' \
            | sed -E 's/"success" \| "error" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"success" \| "info" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"error" \| "success" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "success" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "error" \| "success"/"error" | "info" | "success"/g' \
            | sort -u > /tmp/ts-after.txt
          echo '=== NEW TYPESCRIPT ERRORS ==='
          comm -13 /tmp/ts-baseline.txt /tmp/ts-after.txt | tee /tmp/ts-new.txt
          test ! -s /tmp/ts-new.txt
      - name: Production build validation
        run: npm run build
      - name: Existing recovery tests
        run: npm run test:recovery
      - name: Diff hygiene
        run: git diff --check
      - name: Remove temporary refactor tooling
        run: |
          rm -f scripts/refactor-empenho-actions-v12.mjs
          rm -f .github/workflows/refactor-empenho-actions-v12.yml
          rm -f .github/workflows/refactor-inventory-v12.yml
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name "Moriark"
          git config user.email "marcoa.r.aquino@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: extrai handlers do dominio de empenhos"
          git push origin HEAD:refactor/empenho-actions-v12
