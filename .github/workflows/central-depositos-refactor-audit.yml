name: Central Depositos Refactor Audit

on:
  push:
    branches:
      - refactor/central-depositos-r2

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Core warehouse tests
        run: |
          npm run test:adm-deposito-material
          npm run test:adm-deposito-ledger
          npm run test:adm-deposito-walking-skeleton
          npm run test:adm-deposito-nf-stock
          npm run test:adm-deposito-siscofis
          npm run test:adm-deposito-locations
          npm run test:adm-deposito-stock-operational
          npm run test:adm-deposito-barcode-outbound
          npm run test:adm-deposito-depot-layout
          npm run test:adm-deposito-inventory
          npm run test:adm-deposito-logistics
          npm run test:adm-deposito-depot-locator
          npm run test:adm-deposito-structure-import-r1
          npm run test:adm-deposito-labels-r1
          npm run test:adm-deposito-manual-entry
          npm run test:adm-deposito-outbound-return

      - name: Warehouse guards
        run: |
          npm run verify:adm-deposito-phase-7
          npm run verify:adm-deposito-phase-8
          npm run verify:adm-deposito-phase-9
          npm run verify:adm-deposito-phase-11
          npm run verify:adm-deposito-phase-11-5
          npm run verify:adm-deposito-phase-13
          npm run verify:adm-deposito-modular-r1

      - name: Warehouse security emulator
        run: npm run test:adm-deposito-modular-r1-security

      - name: External access security emulator
        run: npm run test:central-depositos-external-security
