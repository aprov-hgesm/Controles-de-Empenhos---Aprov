name: Temporary view state refactor v11

on:
  push:
    branches:
      - refactor/view-state-hook-v11

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/view-state-hook-v11
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript baseline from main
        shell: bash
        run: |
          git show origin/main:app/page.tsx > /tmp/main-page.tsx
          cp app/page.tsx /tmp/branch-page.tsx
          cp /tmp/main-page.tsx app/page.tsx
          (npx tsc --noEmit --pretty false || true) \
            | sed -E 's/\([0-9]+,[0-9]+\)/(L,C)/g' \
            | sed -E 's/"success" \| "error" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"success" \| "info" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"error" \| "success" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "success" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "error" \| "success"/"error" | "info" | "success"/g' \
            | sort -u > /tmp/ts-baseline.txt
          cp /tmp/branch-page.tsx app/page.tsx

      - name: Apply deterministic view-state refactor
        run: node scripts/refactor-view-state-v11.mjs

      - name: Verify refactor adds no TypeScript errors
        shell: bash
        run: |
          (npx tsc --noEmit --pretty false || true) \
            | sed -E 's/\([0-9]+,[0-9]+\)/(L,C)/g' \
            | sed -E 's/"success" \| "error" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"success" \| "info" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"error" \| "success" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "success" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "error" \| "success"/"error" | "info" | "success"/g' \
            | sort -u > /tmp/ts-after.txt
          if ! diff -u /tmp/ts-baseline.txt /tmp/ts-after.txt; then
            echo "A refatoração alterou o conjunto de erros TypeScript."
            exit 1
          fi

      - name: Production build validation
        run: npm run build

      - name: Existing recovery tests
        run: npm run test:recovery

      - name: Diff hygiene
        run: git diff --check

      - name: Remove temporary refactor tooling
        run: |
          rm -f scripts/refactor-view-state-v11.mjs
          rm -f .github/workflows/refactor-view-state-v11.yml

      - name: Commit validated refactor
        run: |
          git config user.name "Moriark"
          git config user.email "marcoa.r.aquino@gmail.com"
          git add app/page.tsx hooks/useOperationalViewState.ts scripts/refactor-view-state-v11.mjs .github/workflows/refactor-view-state-v11.yml
          git commit -m "refactor: extrai estados operacionais de interface"
          git push origin HEAD:refactor/view-state-hook-v11
