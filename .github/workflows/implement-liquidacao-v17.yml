name: Implement liquidacao consolidada v17

on:
  push:
    branches:
      - feature/liquidacao-consolidada-v17

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript baseline
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/ts-before.txt 2>&1 || true
          cat /tmp/ts-before.txt
          sed -E 's/\([0-9]+,[0-9]+\)/(<pos>)/g' /tmp/ts-before.txt | sort -u > /tmp/ts-before-normalized.txt

      - name: Apply feature codemod
        run: |
          python3 scripts/implement-liquidacao-v17.py
          python3 scripts/fix-liquidacao-v17.py

      - name: Install PDF merge dependency
        run: npm install pdf-lib@^1.17.1 --save

      - name: Validate TypeScript
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/ts-after.txt 2>&1 || true
          cat /tmp/ts-after.txt
          sed -E 's/\([0-9]+,[0-9]+\)/(<pos>)/g' /tmp/ts-after.txt | sort -u > /tmp/ts-after-normalized.txt
          if ! diff -u /tmp/ts-before-normalized.txt /tmp/ts-after-normalized.txt; then
            echo 'TypeScript diagnostics changed. Refusing automatic publication.'
            exit 1
          fi

      - name: Recovery tests
        run: npm run test:recovery

      - name: Production build
        run: npm run build

      - name: Guardrails
        shell: bash
        run: |
          grep -q 'handleUpdateEmpenhoPregao' features/empenhos/hooks/useEmpenhoActions.ts
          grep -q 'localizacaoAtual' lib/types.ts
          grep -q 'handleUpdateInvoiceLocation' features/notas-fiscais/hooks/useNotasFiscaisActions.ts
          grep -q 'Termo de Recebimento' components/TermoRecebimentoActions.tsx
          grep -q 'Documento de Liquidação Consolidada' features/notas-fiscais/components/NotasFiscaisView.tsx
          grep -q 'handleDownloadLiquidacaoConsolidada' features/relatorios/hooks/useDocumentActions.ts
          grep -q 'fetchEmpenhoPdfBlob' lib/empenhoDocuments.ts
          grep -q 'fetchInvoicePdfBlob' lib/invoiceDocuments.ts
          grep -q 'pdf-lib' package.json
          grep -q 'Pregão${safePart' features/relatorios/hooks/useDocumentActions.ts
          git diff --check

      - name: Remove temporary tooling
        shell: bash
        run: |
          rm -f scripts/implement-liquidacao-v17.py
          rm -f scripts/fix-liquidacao-v17.py
          rm -f .github/workflows/implement-liquidacao-v17.yml
          git diff --check

      - name: Commit validated feature
        shell: bash
        run: |
          git config user.name 'Moriark'
          git config user.email 'marcoa.r.aquino@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'feat: adiciona liquidação consolidada e tramitação reversível de NF'
          git push origin HEAD:feature/liquidacao-consolidada-v17
