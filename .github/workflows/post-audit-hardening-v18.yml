name: Post-audit hardening v18

on:
  push:
    branches:
      - refactor/post-audit-hardening-v18

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript baseline
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/ts-before.txt 2>&1 || true
          cat /tmp/ts-before.txt
          sed -E 's/\([0-9]+,[0-9]+\)/(<pos>)/g' /tmp/ts-before.txt | sort -u > /tmp/ts-before-normalized.txt
          grep -c 'error TS[0-9]' /tmp/ts-before.txt > /tmp/ts-before-count.txt || true

      - name: Apply conservative hardening
        run: python3 scripts/post-audit-hardening-v18.py

      - name: Validate TypeScript equivalence
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/ts-after.txt 2>&1 || true
          cat /tmp/ts-after.txt
          sed -E 's/\([0-9]+,[0-9]+\)/(<pos>)/g' /tmp/ts-after.txt | sort -u > /tmp/ts-after-normalized.txt
          if ! diff -u /tmp/ts-before-normalized.txt /tmp/ts-after-normalized.txt; then
            echo 'TypeScript diagnostics changed. Refusing automatic publication.'
            exit 1
          fi
          count=$(grep -c 'error TS[0-9]' /tmp/ts-after.txt || true)
          printf '{\n  "maxErrors": %s,\n  "policy": "No pull request may increase the existing TypeScript error count."\n}\n' "$count" > ops/typescript-error-budget.json

      - name: Recovery tests
        run: npm run test:recovery

      - name: Production build
        run: npm run build

      - name: Guardrails
        shell: bash
        run: |
          grep -q 'ensureTermoRecebimentoAssignment' lib/firebaseSync.ts
          grep -q 'runTransaction' lib/firebaseSync.ts
          grep -q 'writeBatch' lib/firebaseSync.ts
          grep -q 'commitInvoiceReceiptChanges' features/notas-fiscais/hooks/useNotasFiscaisActions.ts
          grep -q 'Não existe Comissão de Recebimento cadastrada para o mês' features/relatorios/hooks/useDocumentActions.ts
          ! grep -q 'matchingComissao = comissoes\[0\]' features/relatorios/hooks/useDocumentActions.ts
          grep -q 'Os produtos estão dentro do prazo de validade?' features/relatorios/hooks/useDocumentActions.ts
          grep -q 'Os produtos atendem todas as especificações constantes da Nota de Empenho e do edital?' features/relatorios/hooks/useDocumentActions.ts
          grep -q 'Diante dos exames realizados, a Comissão de Recebimento DECLARA' features/relatorios/hooks/useDocumentActions.ts
          grep -q 'Application CI' .github/workflows/application-ci.yml
          grep -q 'typescript-error-budget.json' .github/workflows/application-ci.yml
          grep -q '"typecheck": "tsc --noEmit"' package.json
          git diff --check

      - name: Remove temporary tooling
        shell: bash
        run: |
          rm -f scripts/post-audit-hardening-v18.py
          rm -f .github/workflows/post-audit-hardening-v18.yml
          git diff --check

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name 'Moriark'
          git config user.email 'marcoa.r.aquino@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'refactor: reforça integridade operacional pós-auditoria'
          git push origin HEAD:refactor/post-audit-hardening-v18
