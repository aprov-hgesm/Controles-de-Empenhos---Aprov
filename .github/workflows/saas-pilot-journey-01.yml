name: SAAS Pilot Journey 01

on:
  pull_request:
    branches:
      - saas-final-audit-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-pilot-journey-01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  saas-contract-journey:
    name: SaaS contract journey
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: SaaS final audit guard
        run: npm run verify:saas-r1-final-audit

      - name: Onboarding and credentials
        run: npm run verify:saas-r1-onboarding

      - name: Authentication contracts
        run: |
          npm run verify:hybrid-auth-model
          npm run verify:sector-auth-provisioning
          npm run verify:uid-binding

      - name: Legal gate
        run: |
          npm run verify:public-oauth-legal-pages
          npm run verify:saas-r1-legal-acceptance
          npm run test:saas-r1-legal-acceptance

      - name: Billing and trial
        run: npm run verify:block-22-billing

      - name: Lifecycle and regularization
        run: |
          npm run verify:sector-lifecycle
          npm run verify:saas-r1-security-enforcement
          npm run verify:saas-r1-integration

      - name: Session contracts
        run: |
          npm run verify:block-16-1-session-enforcement
          npm run verify:block-17-1-session-lease-efficiency

      - name: Multi-tenant isolation
        run: |
          npm run verify:multitenant-security
          npm run test:security:multitenant

      - name: Core Protection
        run: npm run verify:emprovex-core-protection

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        shell: bash
        run: |
          git fetch origin             "+refs/heads/saas-final-audit-01:refs/remotes/origin/saas-final-audit-01"             "+refs/heads/saas-pilot-journey-01:refs/remotes/origin/saas-pilot-journey-01"             --depth=256
          merge_base="$(git merge-base origin/saas-final-audit-01 HEAD)"
          git diff --check "$merge_base"..HEAD

  browser-e2e-emulator:
    name: Browser E2E SaaS journey
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: External login, Legal Gate, Central and cross-workspace isolation
        shell: bash
        run: |
          npx --yes firebase-tools emulators:exec             --config firebase.security-test.json             --project demo-emprovex-security             --only auth,firestore             'node scripts/e2e-browser-emulator.mjs operator-critical-flow.spec.mjs --grep "login -> relatório|usuário externo autenticado vê a Central de Depósitos|segundo workspace não enxerga|quatro sessões independentes"'

      - name: Session lease and revocation browser smoke
        shell: bash
        run: |
          npx --yes firebase-tools emulators:exec             --config firebase.security-test.json             --project demo-emprovex-security             --only auth,firestore             'node scripts/e2e-browser-emulator.mjs block-16-integrated.spec.mjs --grep "heartbeat eficiente|lease dinâmico expirado|revogação administrativa derruba todas|tombstone bloqueia retorno"'
