name: EMPROVEX Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emprovex-fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Fast validation — tipos, SDK writes e domínio afetado
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout com base para diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 20 e cache npm
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Dependências
        run: npm ci
      - name: CI LEAN planner — fail-closed selection and negative tests
        run: node --test scripts/ci-lean-plan.test.mjs scripts/ci-lean-syntax.test.mjs scripts/ci-lean-domain.test.mjs scripts/ci-lean-guards.test.mjs scripts/ci-lean-mutations.test.mjs scripts/ci-lean-coverage.test.mjs
      - name: Executable JavaScript syntax (including .mjs)
        run: node scripts/ci-lean-syntax.mjs
      - name: Mobile R2 authenticated operation contracts (phase 0)
        run: |
          npm run verify:mobile-r1-integration-3
          npm run verify:mobile-r1-integration-final
          npm run verify:mobile-k-canonical-ops
      - name: Navegação P0 entre áreas (sem F5)
        run: node --test scripts/critical-cross-route-navigation.test.mjs
      - name: TypeScript sem erros
        run: npm run typecheck
      - name: Zero gravações Warehouse pelo SDK do cliente
        run: WAREHOUSE_R2_STRICT=1 node scripts/warehouse-r2-direct-write-audit.mjs
      - name: Testes unitários afetados (relatório acumulado, gate estrito)
        run: node scripts/ci-fast-tests.mjs
