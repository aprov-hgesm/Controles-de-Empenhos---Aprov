name: Temporary dashboard refactor v3

on:
  push:
    branches:
      - refactor/dashboard-view-v3
    paths:
      - ".github/workflows/refactor-dashboard-v3.yml"
      - "scripts/refactor-dashboard-v3.mjs"

permissions:
  contents: write

jobs:
  refactor-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/dashboard-view-v3
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript baseline from main
        shell: bash
        run: |
          git show origin/main:app/page.tsx > /tmp/main-page.tsx
          cp app/page.tsx /tmp/branch-page.tsx
          cp /tmp/main-page.tsx app/page.tsx
          (npx tsc --noEmit --pretty false || true) | sed -E 's#^app/page\.tsx\([0-9]+,[0-9]+\)#app/page.tsx(L,C)#' | sort -u > /tmp/ts-baseline.txt
          cp /tmp/branch-page.tsx app/page.tsx

      - name: Apply deterministic dashboard refactor
        run: node scripts/refactor-dashboard-v3.mjs

      - name: Verify refactor adds no TypeScript errors
        shell: bash
        run: |
          (npx tsc --noEmit --pretty false || true) | sed -E 's#^app/page\.tsx\([0-9]+,[0-9]+\)#app/page.tsx(L,C)#' | sed -E 's#^features/dashboard/components/DashboardView\.tsx\([0-9]+,[0-9]+\)#app/page.tsx(L,C)#' | sort -u > /tmp/ts-after.txt
          if ! diff -u /tmp/ts-baseline.txt /tmp/ts-after.txt; then
            echo "A refatoração alterou o conjunto de erros TypeScript."
            exit 1
          fi

      - name: Production build validation
        run: npm run build

      - name: Existing recovery tests
        run: npm run test:recovery

      - name: Diff hygiene
        run: git diff --check

      - name: Remove temporary refactor tooling
        run: |
          rm -f scripts/refactor-dashboard-v3.mjs
          rm -f .github/workflows/refactor-dashboard-v3.yml
          rm -f tsconfig.tsbuildinfo

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extrai dashboard do page"
          git push origin HEAD:refactor/dashboard-view-v3
