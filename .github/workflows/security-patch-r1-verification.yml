# Temporary validation workflow for R1. Remove before opening the PR.
name: Security Patch R1 verification (temporary)
on:
  push:
    branches: [fix/security-patch-r1-20261030]
    paths:
      - ".github/workflows/security-patch-r1-verification.yml"
permissions:
  contents: read
concurrency:
  group: security-patch-r1-verification
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Verify deterministic install
        run: npm ci --no-fund --no-audit
      - name: Audit baseline and patched lockfiles without auto-fix
        shell: bash
        run: |
          mkdir -p /tmp/emprovex-r1-baseline
          git show 8837caea1029d0023f6ec8768391dd27c1dc4d6c:package.json > /tmp/emprovex-r1-baseline/package.json
          git show 8837caea1029d0023f6ec8768391dd27c1dc4d6c:package-lock.json > /tmp/emprovex-r1-baseline/package-lock.json
          (cd /tmp/emprovex-r1-baseline && npm audit --json > /tmp/r1-audit-before.json) || true
          npm audit --json > /tmp/r1-audit-after.json || true
          node <<'NODE'
          const fs=require('fs');
          for(const label of ['before','after']){
            let j=JSON.parse(fs.readFileSync('/tmp/r1-audit-'+label+'.json','utf8'));
            console.log('AUDIT_'+label.toUpperCase()+'='+JSON.stringify({vulnerabilities:j.metadata?.vulnerabilities,errors:j.error||null,packages:Object.keys(j.vulnerabilities||{}).filter(k=>['next','undici','dompurify','sharp','react-server-dom-webpack','react-server-dom-turbopack','react-server-dom-parcel'].includes(k)).map(k=>({package:k,severity:j.vulnerabilities[k].severity,range:j.vulnerabilities[k].range}))}));
          }
          NODE
      - name: TypeScript validation
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/r1-typescript.log 2>&1
          rc=$?
          cat /tmp/r1-typescript.log
          echo "R1_TYPESCRIPT_EXIT=$rc"
          exit 0
      - name: Production build (local runner only)
        shell: bash
        run: |
          set +e
          npm run build > /tmp/r1-build.log 2>&1
          rc=$?
          tail -n 110 /tmp/r1-build.log
          echo "R1_BUILD_EXIT=$rc"
          exit 0
      - name: Protected security and operational tests (fixtures and mocks)
        shell: bash
        run: |
          set +e
          for script in verify:emprovex-core-protection verify:multitenant-security test:cronograma-email test:invoice-identity test:adm-deposito-outbound-return; do
            echo "=== TEST $script ==="
            npm run "$script" > /tmp/r1-test.log 2>&1
            rc=$?
            tail -n 35 /tmp/r1-test.log
            echo "R1_TEST_RESULT $script exit=$rc"
          done
          node --test scripts/warehouse-server-command-security.test.mjs > /tmp/r1-security.log 2>&1
          rc=$?
          tail -n 45 /tmp/r1-security.log
          echo "R1_TEST_RESULT warehouse-server-command-security exit=$rc"
          exit 0
