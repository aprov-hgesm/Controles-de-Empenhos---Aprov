name: Invoice TypeScript step

on:
  push:
    branches:
      - fix/typescript-invoice-debt-v19
    paths:
      - ops/invoice-typescript.step

permissions:
  contents: write

jobs:
  fix-errors-sequentially:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove invalid App Router re-export surgically
        shell: bash
        run: |
          git config user.name 'Moriark'
          git config user.email 'marcoa.r.aquino@gmail.com'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          text = p.read_text(encoding='utf-8')
          needle = "export { PROMPT_EXTRACAO_EMPENHO } from '../features/empenhos/domain/empenhoHelpers';\n"
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'esperado exatamente 1 re-export inválido, encontrado {count}')
          p.write_text(text.replace(needle, '', 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- app/page.tsx | awk '{print $1":"$2}')" = "0:1"
          git add app/page.tsx
          git commit -m 'fix(types): remove reexport inválido do App Router'

      - name: Fix each remaining Invoice diagnostic one by one
        shell: bash
        run: |
          START=$(tr -d '[:space:]' < ops/invoice-typescript.step)
          for STEP in $(seq "$START" 9); do
            echo "===== STEP $STEP/9 ====="
            npm run typecheck > /tmp/before.txt 2>&1 || true
            cat /tmp/before.txt
            current=$(grep -c 'error TS[0-9]' /tmp/before.txt || true)
            expected_before=$((10 - STEP))
            echo "Before: $current / expected: $expected_before"
            test "$current" -eq "$expected_before"

            STEP="$STEP" python3 scripts/fix-invoice-typescript-step.py

            npm run typecheck > /tmp/after.txt 2>&1 || true
            cat /tmp/after.txt
            current=$(grep -c 'error TS[0-9]' /tmp/after.txt || true)
            expected_after=$((9 - STEP))
            echo "After: $current / expected: $expected_after"
            test "$current" -eq "$expected_after"

            node -e "const fs=require('fs');const p='ops/typescript-error-budget.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.maxErrors=$current;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\\n')"
            git diff --check
            git add features/empenhos/components/EmpenhosView.tsx ops/typescript-error-budget.json
            git commit -m "fix(types): corrige referência Invoice $STEP/9"
          done

      - name: Recovery tests
        run: npm run test:recovery

      - name: Production build
        run: npm run build

      - name: Final clean typecheck
        run: npm run typecheck

      - name: Publish only after all validations pass
        run: git push origin HEAD:fix/typescript-invoice-debt-v19
