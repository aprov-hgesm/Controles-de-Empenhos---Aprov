name: Harden invoice PDF documents v16

on:
  push:
    branches:
      - feature/invoice-pdf-documents-v16

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript baseline
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/ts-before.txt 2>&1 || true
          cat /tmp/ts-before.txt

      - name: Apply hardening
        run: python3 scripts/harden-invoice-documents-v16.py

      - name: Verify no new TypeScript errors
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/ts-after.txt 2>&1 || true
          cat /tmp/ts-after.txt
          if ! diff -u /tmp/ts-before.txt /tmp/ts-after.txt; then
            echo 'TypeScript diagnostics changed. Refusing publication.'
            exit 1
          fi

      - name: Recovery tests
        run: npm run test:recovery

      - name: Production build
        run: npm run build

      - name: Security and feature guardrails
        shell: bash
        run: |
          grep -q "assertInvoiceUploadPath(url.searchParams.get('pathname'), empenhoId, invoiceId)" app/api/invoice-documents/route.ts
          grep -q "invoiceId?: unknown" app/api/invoice-documents/route.ts
          grep -q "body: JSON.stringify({ empenhoId, invoiceId, pathname })" lib/invoiceDocuments.ts
          ! grep -q 'removeInvoiceDocuments' features/notas-fiscais/hooks/useNotasFiscaisActions.ts
          grep -q 'Documento — Nota Fiscal' features/notas-fiscais/components/NotasFiscaisView.tsx
          grep -q 'Documento — Nota de Empenho' components/EmpenhoDocumentActions.tsx
          git diff --check

      - name: Remove temporary tooling
        shell: bash
        run: |
          rm -f scripts/harden-invoice-documents-v16.py
          rm -f .github/workflows/harden-invoice-documents-v16.yml
          git diff --check

      - name: Commit hardened feature
        shell: bash
        run: |
          git config user.name 'Moriark'
          git config user.email 'marcoa.r.aquino@gmail.com'
          git add -A
          git commit -m 'fix: reforça segurança e integridade dos PDFs de notas fiscais'
          git push origin HEAD:feature/invoice-pdf-documents-v16
