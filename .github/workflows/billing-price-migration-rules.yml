name: Billing Price Migration Firestore Rules

on:
  pull_request:
    paths:
      - firestore.rules
      - scripts/billing-price-migration-rules-emulator.test.mjs
      - .github/workflows/billing-price-migration-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Founder-only atomic billing migration with Auth and Firestore emulators
        run: npx --yes firebase-tools emulators:exec --config firebase.security-test.json --project demo-emprovex-billing-migration --only auth,firestore "node --test scripts/billing-price-migration-rules-emulator.test.mjs"
      - name: Existing billing domain regression
        run: node --test scripts/saas-r1-billing.test.mjs
