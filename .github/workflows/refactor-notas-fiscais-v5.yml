name: Temporary notas fiscais refactor v5

on:
  push:
    branches:
      - refactor/notas-fiscais-view-v5

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/notas-fiscais-view-v5
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript baseline from main
        shell: bash
        run: |
          git show origin/main:app/page.tsx > /tmp/main-page.tsx
          cp app/page.tsx /tmp/branch-page.tsx
          cp /tmp/main-page.tsx app/page.tsx
          (npx tsc --noEmit --pretty false || true) \
            | sed -E 's#^app/page\.tsx\([0-9]+,[0-9]+\)#app/page.tsx(L,C)#' \
            | sort -u > /tmp/ts-baseline.txt
          cp /tmp/branch-page.tsx app/page.tsx

      - name: Apply deterministic Notas Fiscais refactor
        run: node scripts/refactor-notas-fiscais-v5.mjs

      - name: Verify refactor adds no TypeScript errors
        shell: bash
        run: |
          (npx tsc --noEmit --pretty false || true) \
            | sed -E 's#^app/page\.tsx\([0-9]+,[0-9]+\)#app/page.tsx(L,C)#' \
            | sed -E 's#^features/notas-fiscais/components/NotasFiscaisView\.tsx\([0-9]+,[0-9]+\)#app/page.tsx(L,C)#' \
            | sort -u > /tmp/ts-after.txt
          if ! diff -u /tmp/ts-baseline.txt /tmp/ts-after.txt; then
            echo "A refatoração alterou o conjunto de erros TypeScript."
            exit 1
          fi

      - name: Production build validation
        run: npm run build

      - name: Existing recovery tests
        run: npm run test:recovery

      - name: Diff hygiene
        run: git diff --check

      - name: Remove temporary refactor tooling
        run: |
          rm -f scripts/refactor-notas-fiscais-v5.mjs
          rm -f .github/workflows/refactor-notas-fiscais-v5.yml
          git diff --check

      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 1
          fi
          git commit -m "refactor: extrai gestão de notas fiscais"
          git push origin HEAD:refactor/notas-fiscais-view-v5
