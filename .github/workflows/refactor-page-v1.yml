name: Temporary page refactor v1

on:
  push:
    branches:
      - refactor/page-modularization-v1
    paths:
      - ".github/workflows/refactor-page-v1.yml"
      - "scripts/refactor-page-v1.mjs"

permissions:
  contents: write

jobs:
  refactor-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/page-modularization-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic refactor
        run: node scripts/refactor-page-v1.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Production build validation
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Remove temporary refactor tooling
        run: |
          rm -f scripts/refactor-page-v1.mjs
          rm -f .github/workflows/refactor-page-v1.yml

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extrai helpers e branding do page"
          git push origin HEAD:refactor/page-modularization-v1
