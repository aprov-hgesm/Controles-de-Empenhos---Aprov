name: Application CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emprovex-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-application:
    # PR Draft roda Fast CI e Core; PR ready executa toda a certificação.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # Explicit manual certification is always strict: absent W1/AuthZ is NO-GO.
    env:
      CI_LEAN_REQUIRE_COMPOSED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff --check HEAD^
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Vercel contingency protection (Git auto-deploy disabled)
        run: npm run test:vercel-manual-deploy

      - name: Admin digital neighborhood contracts
        run: npm run test:admin-world-neighborhood

      - name: Firestore Enterprise financial estimate contract tests
        run: npm run test:firestore-cost-estimate

      - name: TypeScript error budget
        shell: bash
        run: |
          rc=0
          npm run typecheck > /tmp/typecheck.txt 2>&1 || rc=$?
          cat /tmp/typecheck.txt
          current=$(grep -c 'error TS[0-9]' /tmp/typecheck.txt || true)
          budget=$(node -p "require('./ops/typescript-error-budget.json').maxErrors")
          echo "TypeScript diagnostics: $current / budget: $budget"
          if [ "$rc" -ne 0 ] && [ "$current" -eq 0 ]; then
            echo 'TypeScript command failed without TS diagnostics.'
            exit "$rc"
          fi
          if [ "$current" -gt "$budget" ]; then
            echo 'TypeScript error budget exceeded.'
            exit 1
          fi

      - name: CI LEAN R2 selector and syntax negative tests
        run: node --test scripts/ci-lean-plan.test.mjs scripts/ci-lean-syntax.test.mjs scripts/ci-lean-domain.test.mjs scripts/ci-lean-guards.test.mjs scripts/ci-lean-mutations.test.mjs scripts/ci-lean-coverage.test.mjs

      - name: Changed executable JavaScript syntax
        run: node scripts/ci-lean-syntax.mjs

      - name: Warehouse R2 strict zero client SDK writes
        run: WAREHOUSE_R2_STRICT=1 node scripts/warehouse-r2-direct-write-audit.mjs

      - name: Cronograma Gmail attachment contract tests
        run: npm run test:cronograma-email

      - name: Cronograma sent-history and NF-week tests
        run: node --test scripts/cronograma-tracking.test.mjs

      - name: EMPROVEX core operational protection
        run: npm run verify:emprovex-core-protection

      - name: Recovery tests
        run: npm run test:recovery

      - name: Legacy runtime guard
        run: npm run audit:legacy-runtime

      - name: CI LEAN R2 G01 — 17 historical guards
        run: node scripts/ci-lean-guards.mjs --group G01
        # CI_LEAN_LEGACY G01: Final document storage guard | Workspace Google Drive guard | Hybrid authentication model guard
        # CI_LEAN_LEGACY G01: Firestore provider enforcement guard | Sector auth provisioning guard | Sector admin deletion guard
        # CI_LEAN_LEGACY G01: Sector password reset guard | SaaS R1 onboarding and credentials guard | SAAS R1 security enforcement guard
        # CI_LEAN_LEGACY G01: SAAS R1 integrated contract guard | SAAS R1 final audit contract guard | Empenho class configuration guard
        # CI_LEAN_LEGACY G01: Public OAuth legal pages guard | External sector login guard | Secure UID binding guard
        # CI_LEAN_LEGACY G01: Workspace provisioning guard | Workspace Drive onboarding guard

      - name: External Drive OAuth behavior tests
        run: npm run test:external-drive-auth

      - name: External Drive OAuth Firebase Auth emulator tests
        run: npm run test:external-drive-auth-emulator

      - name: Sector lifecycle guard
        run: npm run verify:sector-lifecycle

      - name: Multi-tenant security suite guard
        run: npm run verify:multitenant-security

      - name: Multi-tenant Firestore security tests
        run: npm run test:security:multitenant

      - name: W5 deterministic profile/candidate-saturation invariants (no timing thresholds)
        run: npm run test:core-lean-r2-w5-profile

      - name: W5 historical EPX1/EPX2/barcode/withdrawal identity compatibility
        run: npm run test:core-lean-r2-w5-historical

      - name: W1 v3 behavioral contract (strict when composed)
        run: npm run test:core-lean-r2-w1-contract

      - name: W4 stable v2 identity compatibility
        run: npm run test:core-lean-r2-w4-contract

      - name: W4 isolated authenticated adversarial Warehouse transactions
        env:
          NEXT_PUBLIC_EMPROVEX_E2E_PROJECT_ID: demo-emprovex-security
        run: npm run test:core-lean-r2-w4-assurance

      - name: W1 isolated v3 concurrency, replay and withdrawal (required when composed)
