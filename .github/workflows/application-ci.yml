        run: npm run test:warehouse-3d-stock

      - name: Recovered warehouse location inspection and PDF tests
        run: npm run test:warehouse-location-inspection

      - name: Recovered warehouse global material search tests
        run: npm run test:warehouse-global-material-search

      - name: Recovered warehouse existing depot/location tests
        run: npm run test:warehouse-existing-depot-location-create

      - name: Recovered warehouse depot registration safety tests
        run: npm run test:warehouse-depot-registration-r1

      - name: ADM Depósito Phase 9 permanent guard
        run: npm run verify:adm-deposito-phase-9

      - name: ADM Depósito Phase 10 physical inventory domain tests
        run: npm run test:adm-deposito-inventory

      - name: ADM Depósito Phase 10 permanent guard
        run: npm run verify:adm-deposito-phase-10

      - name: ADM Depósito Phase 11 logistics domain tests
        run: npm run test:adm-deposito-logistics

      - name: CI LEAN R2 G03 — 4 historical guards
        run: node scripts/ci-lean-guards.mjs --group G03

      - name: Reporting foundation identity tests
        run: npm run test:invoice-identity

      - name: CI LEAN R2 G04 — 3 historical guards
        run: node scripts/ci-lean-guards.mjs --group G04

      - name: Reporting period tests
        run: npm run test:reporting-period

      - name: Report empenho detail guard
        run: npm run verify:report-empenho-detail

      - name: Supplier reporting aggregation tests
        run: npm run test:supplier-reporting

      - name: Supplier reports guard
        run: npm run verify:supplier-reports

      - name: SAG NS contract tests
        run: npm run test:sag-ns-contract

      - name: SAG NS contract guard
        run: npm run verify:sag-ns-contract

      - name: SAG import assistant guard
        run: npm run verify:sag-import-assistant

      - name: SAG NS reconciliation tests
        run: npm run test:sag-ns-reconciliation

      - name: SAG NS reconciliation guard
        run: npm run verify:sag-ns-reconciliation

      - name: SAG application preview tests
        run: npm run test:sag-application-preview

      - name: SAG application preview guard
        run: npm run verify:sag-application-preview

      - name: SAG NS persistence tests
        run: npm run test:sag-ns-persistence

      - name: CI LEAN R2 G05 — 3 historical guards
        run: node scripts/ci-lean-guards.mjs --group G05

      - name: NS integrity contract tests
        run: npm run test:ns-integrity-contract

      - name: NS integrity contract guard
        run: npm run verify:ns-integrity-contract

      - name: NS integrity domain tests
        run: npm run test:ns-integrity

      - name: CI LEAN R2 G06 — 5 historical guards
        run: node scripts/ci-lean-guards.mjs --group G06

      - name: Supplier CNPJ migration tests
        run: npm run test:supplier-cnpj-migration

      - name: CI LEAN R2 G07 — 9 historical guards
        run: node scripts/ci-lean-guards.mjs --group G07

      - name: Empenho concurrency domain tests
        run: npm run test:empenho-concurrency

      - name: Block 13 empenho concurrency guard
        run: npm run verify:block-13-empenho-concurrency

      - name: Operational subscription plan tests
        run: npm run test:operational-subscription-plan

      - name: CI LEAN R2 G08 — 12 historical guards
        run: node scripts/ci-lean-guards.mjs --group G08

      - name: Block 16.8 integrated domain tests
        run: npm run test:block-16-8-integrated-domain

      - name: CI LEAN R2 G09 — 14 historical guards
        run: node scripts/ci-lean-guards.mjs --group G09

      - name: Backup disaster recovery emulator test
        run: npm run test:backup-recovery

      - name: CI LEAN R2 G10 — 30 historical guards
        run: node scripts/ci-lean-guards.mjs --group G10

      - name: Admin visual-only layout and behavior guard
        run: node --test scripts/admin-visual-only.test.mjs

      - name: SPED NUP reporting guard
        run: npm run verify:sped-nup-reporting

      - name: EMPROVEX brand logo lock security test
        run: npm run test:brand-logo-lock

      - name: EMPROVEX brand logo lock guard
        run: npm run verify:brand-logo-lock

      - name: EMPROVEX final experience guard
        run: npm run verify:experience-finalization

      - name: Production build
        run: npm run build

      # No second tsc here: the zero-error TypeScript budget gate above already
      # compiles TS, and the Next production build validates generated types.


  block-16-release-gate:
    name: Block 16 Final Release Gate
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs:
      - validate-application
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all critical validation jobs
        shell: bash
        run: |
          echo "validate-application=${{ needs.validate-application.result }}"
          test "${{ needs.validate-application.result }}" = "success"
  block-17-final-release-gate:
    name: Block 17 Final Release Gate
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs:
      - validate-application
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Block 17 critical validation jobs
        shell: bash
        run: |
          echo "validate-application=${{ needs.validate-application.result }}"
          test "${{ needs.validate-application.result }}" = "success"
          echo "BLOCK 17 FINAL RELEASE: READY"

  block-18-final-release-gate:
    name: Block 18 Final Release Gate
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs:
      - validate-application
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Block 18 critical validation jobs
        shell: bash
        run: |
          echo "validate-application=${{ needs.validate-application.result }}"
          test "${{ needs.validate-application.result }}" = "success"
          echo "BLOCK 18 FINAL RELEASE: READY"

  block-19-final-closure-gate:
    name: Block 19 Final Closure Gate
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs:
      - validate-application
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Block 19 critical validation jobs
        shell: bash
        run: |
          echo "validate-application=${{ needs.validate-application.result }}"
          test "${{ needs.validate-application.result }}" = "success"
          echo "BLOCK 19 FINAL CLOSURE: READY"

  block-20-final-release-gate:
    name: Block 20 Final Release Gate
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs:
      - validate-application
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Block 20 critical validation jobs
        shell: bash
        run: |
          echo "validate-application=${{ needs.validate-application.result }}"
          test "${{ needs.validate-application.result }}" = "success"
          echo "BLOCK 20 FINAL RELEASE: READY"

  block-21-final-release-gate:
    name: Block 21 Final Release Gate
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs:
      - validate-application
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require Block 21 critical validation jobs
        shell: bash
        run: |
          echo "validate-application=${{ needs.validate-application.result }}"
          test "${{ needs.validate-application.result }}" = "success"
          echo "BLOCK 21 FINAL RELEASE: READY"
