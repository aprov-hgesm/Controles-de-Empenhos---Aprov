        run: npm run test:mobile-r1-manual-entry

      - name: Entrada avulsa server-only e seguranca Firestore (Emulator)
        run: npx --yes firebase-tools emulators:exec --config firebase.warehouse-security-test.json --project demo-emprovex-security --only auth,firestore "node scripts/warehouse-manual-entry-atomic-security.test.mjs && npx --yes tsx scripts/warehouse-server-manual-entry-emulator.ts"

      - name: MOBILE-K canonical ops domain tests
        run: npm run test:mobile-k-canonical-ops

      - name: MOBILE-K canonical ops permanent guard
        run: npm run verify:mobile-k-canonical-ops

      - name: ADM Depósito Phase 9 depot layout domain tests
        run: npm run test:adm-deposito-depot-layout

