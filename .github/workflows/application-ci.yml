name: Application CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emprovex-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript error budget
        shell: bash
        run: |
          npm run typecheck > /tmp/typecheck.txt 2>&1 || true
          cat /tmp/typecheck.txt
          current=$(grep -c 'error TS[0-9]' /tmp/typecheck.txt || true)
          budget=$(node -p "require('./ops/typescript-error-budget.json').maxErrors")
          echo "TypeScript diagnostics: $current / budget: $budget"
          if [ "$current" -gt "$budget" ]; then
            echo 'TypeScript error budget exceeded.'
            exit 1
          fi

      - name: Recovery tests
        run: npm run test:recovery

      - name: Legacy runtime guard
        run: npm run audit:legacy-runtime

      - name: Final document storage guard
        run: npm run verify:storage-provider

