name: Application CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript error budget
        shell: bash
        run: |
          npm run typecheck > /tmp/typecheck.txt 2>&1 || true
          cat /tmp/typecheck.txt
          current=$(grep -c 'error TS[0-9]' /tmp/typecheck.txt || true)
          budget=$(node -p "require('./ops/typescript-error-budget.json').maxErrors")
          echo "TypeScript diagnostics: $current / budget: $budget"
          if [ "$current" -gt "$budget" ]; then
            echo 'TypeScript error budget exceeded.'
            exit 1
          fi

      - name: Recovery tests
        run: npm run test:recovery

      - name: Legacy runtime guard
        run: npm run audit:legacy-runtime

      - name: Final document storage guard
        run: npm run verify:storage-provider

      - name: Workspace Google Drive guard
        run: npm run verify:workspace-drive

      - name: Hybrid authentication model guard
        run: npm run verify:hybrid-auth-model

      - name: Firestore provider enforcement guard
        run: npm run verify:firestore-provider-enforcement

      - name: Sector auth provisioning guard
        run: npm run verify:sector-auth-provisioning

      - name: Sector admin deletion guard
        run: npm run verify:sector-admin-deletion

      - name: Sector password reset guard
        run: npm run verify:sector-password-reset

      - name: Empenho class configuration guard
        run: npm run verify:empenho-class-config

      - name: Public OAuth legal pages guard
        run: npm run verify:public-oauth-legal-pages

      - name: External sector login guard
        run: npm run verify:external-sector-login

      - name: Secure UID binding guard
        run: npm run verify:uid-binding

      - name: Workspace provisioning guard
        run: npm run verify:workspace-provisioning

      - name: Workspace Drive onboarding guard
        run: npm run verify:workspace-drive-onboarding

      - name: Sector lifecycle guard
        run: npm run verify:sector-lifecycle

      - name: Multi-tenant security suite guard
        run: npm run verify:multitenant-security

      - name: Multi-tenant Firestore security tests
        run: npm run test:security:multitenant

      - name: Production multi-tenant readiness guard
        run: npm run verify:production-multitenant-readiness

      - name: Production build
        run: npm run build

      - name: Final TypeScript validation
        run: npm run typecheck

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff --check HEAD^
          fi
