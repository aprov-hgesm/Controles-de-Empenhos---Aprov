      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff --check HEAD^
          fi


  browser-e2e-emulator:
    name: Browser E2E with Firebase Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E with Firebase Emulator
        run: npm run test:e2e:browser


  block-16-release-gate:
    name: Block 16 Final Release Gate
    if: ${{ always() }}
    needs:
      - validate-application
      - browser-e2e-emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all critical validation jobs
        shell: bash
        run: |
          echo "validate-application=${{ needs.validate-application.result }}"
          echo "browser-e2e-emulator=${{ needs.browser-e2e-emulator.result }}"
          test "${{ needs.validate-application.result }}" = "success"
          test "${{ needs.browser-e2e-emulator.result }}" = "success"
  block-17-final-release-gate:
    name: Block 17 Final Release Gate
    if: ${{ always() }}
    needs:
      - validate-application
      - browser-e2e-emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 2
