name: Application CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript error budget
        shell: bash
        run: |
          npm run typecheck > /tmp/typecheck.txt 2>&1 || true
          cat /tmp/typecheck.txt
          current=$(grep -c 'error TS[0-9]' /tmp/typecheck.txt || true)
          budget=$(node -p "require('./ops/typescript-error-budget.json').maxErrors")
          echo "TypeScript diagnostics: $current / budget: $budget"
          if [ "$current" -gt "$budget" ]; then
            echo 'TypeScript error budget exceeded.'
            exit 1
          fi

      - name: Recovery tests
        run: npm run test:recovery

      - name: Legacy runtime guard
        run: npm run audit:legacy-runtime

      - name: Final document storage guard
        run: npm run verify:storage-provider

      - name: Workspace Google Drive guard
        run: npm run verify:workspace-drive

      - name: Hybrid authentication model guard
        run: npm run verify:hybrid-auth-model

      - name: Firestore provider enforcement guard
        run: npm run verify:firestore-provider-enforcement

      - name: Sector auth provisioning guard
        run: npm run verify:sector-auth-provisioning

      - name: Sector admin deletion guard
        run: npm run verify:sector-admin-deletion

      - name: Sector password reset guard
        run: npm run verify:sector-password-reset

      - name: Empenho class configuration guard
        run: npm run verify:empenho-class-config

      - name: Public OAuth legal pages guard
        run: npm run verify:public-oauth-legal-pages

      - name: External sector login guard
        run: npm run verify:external-sector-login

      - name: Secure UID binding guard
        run: npm run verify:uid-binding

      - name: Workspace provisioning guard
        run: npm run verify:workspace-provisioning

      - name: Workspace Drive onboarding guard
        run: npm run verify:workspace-drive-onboarding

      - name: External Drive OAuth behavior tests
        run: npm run test:external-drive-auth

      - name: External Drive OAuth Firebase Auth emulator tests
        run: npm run test:external-drive-auth-emulator

      - name: Sector lifecycle guard
        run: npm run verify:sector-lifecycle

      - name: Multi-tenant security suite guard
        run: npm run verify:multitenant-security

      - name: Multi-tenant Firestore security tests
        run: npm run test:security:multitenant

      - name: Production multi-tenant readiness guard
        run: npm run verify:production-multitenant-readiness

      - name: Reporting foundation identity tests
        run: npm run test:invoice-identity

      - name: Reporting foundation guard
        run: npm run verify:reporting-foundation

      - name: Reports subtabs shell guard
        run: npm run verify:reports-shell

      - name: Report empenho card selector guard
        run: npm run verify:report-empenho-selector

      - name: Reporting period tests
        run: npm run test:reporting-period

      - name: Report empenho detail guard
        run: npm run verify:report-empenho-detail

      - name: Supplier reporting aggregation tests
        run: npm run test:supplier-reporting

      - name: Supplier reports guard
        run: npm run verify:supplier-reports

      - name: SAG NS contract tests
        run: npm run test:sag-ns-contract

      - name: SAG NS contract guard
        run: npm run verify:sag-ns-contract

      - name: SAG import assistant guard
        run: npm run verify:sag-import-assistant

      - name: SAG NS reconciliation tests
        run: npm run test:sag-ns-reconciliation

      - name: SAG NS reconciliation guard
        run: npm run verify:sag-ns-reconciliation

      - name: SAG application preview tests
        run: npm run test:sag-application-preview

      - name: SAG application preview guard
        run: npm run verify:sag-application-preview

      - name: SAG NS persistence tests
        run: npm run test:sag-ns-persistence

      - name: SAG NS idempotent import guard
        run: npm run verify:sag-ns-idempotent-import

      - name: SAG NS hardening guard
        run: npm run verify:sag-ns-hardening

      - name: SAG UX guard
        run: npm run verify:sag-ux

      - name: NS integrity contract tests
        run: npm run test:ns-integrity-contract

      - name: NS integrity contract guard
        run: npm run verify:ns-integrity-contract

      - name: NS integrity domain tests
        run: npm run test:ns-integrity

      - name: NS integrity service guard
        run: npm run verify:ns-integrity-service

      - name: Manual NS integrity guard
        run: npm run verify:manual-ns-integrity

      - name: Invoice NS lifecycle guard
        run: npm run verify:invoice-ns-lifecycle

      - name: Supplier CNPJ migration tests
        run: npm run test:supplier-cnpj-migration

      - name: Supplier CNPJ migration guard
        run: npm run verify:supplier-cnpj-migration

      - name: Global NS Firestore Rules guard
        run: npm run verify:global-ns-rules

      - name: EMPROVEX App Shell guard
        run: npm run verify:app-shell

      - name: EMPROVEX brand identity foundation guard
        run: npm run verify:brand-identity-foundation

      - name: EMPROVEX brand notifications guard
        run: npm run verify:brand-notifications

      - name: EMPROVEX empenhos subtabs guard
        run: npm run verify:empenhos-subtabs

      - name: EMPROVEX brand admin guard
        run: npm run verify:brand-admin

      - name: EMPROVEX brand logo lock security test
        run: npm run test:brand-logo-lock

      - name: EMPROVEX brand logo lock guard
        run: npm run verify:brand-logo-lock

      - name: EMPROVEX final experience guard
        run: npm run verify:experience-finalization

      - name: Production build
        run: npm run build

      - name: Final TypeScript validation
        run: npm run typecheck

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff --check HEAD^
          fi
