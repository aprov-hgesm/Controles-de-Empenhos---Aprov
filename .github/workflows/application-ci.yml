name: Application CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emprovex-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-application:
    # PR Draft roda Fast CI e Core; PR ready executa toda a certificação.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff --check HEAD^
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Vercel manual deployment policy
        run: npm run test:vercel-manual-deploy

      - name: Admin digital neighborhood contracts
        run: npm run test:admin-world-neighborhood

      - name: Firestore Enterprise financial estimate contract tests
        run: npm run test:firestore-cost-estimate

      - name: TypeScript error budget
        shell: bash
        run: |
          rc=0
          npm run typecheck > /tmp/typecheck.txt 2>&1 || rc=$?
          cat /tmp/typecheck.txt
          current=$(grep -c 'error TS[0-9]' /tmp/typecheck.txt || true)
          budget=$(node -p "require('./ops/typescript-error-budget.json').maxErrors")
          echo "TypeScript diagnostics: $current / budget: $budget"
          if [ "$rc" -ne 0 ] && [ "$current" -eq 0 ]; then
            echo 'TypeScript command failed without TS diagnostics.'
            exit "$rc"
          fi
          if [ "$current" -gt "$budget" ]; then
            echo 'TypeScript error budget exceeded.'
            exit 1
          fi

      - name: CI LEAN R2 selector and syntax negative tests
        run: node --test scripts/ci-lean-plan.test.mjs scripts/ci-lean-syntax.test.mjs scripts/ci-lean-domain.test.mjs scripts/ci-lean-guards.test.mjs

      - name: Changed executable JavaScript syntax
        run: node scripts/ci-lean-syntax.mjs

      - name: Warehouse R2 strict zero client SDK writes
        run: WAREHOUSE_R2_STRICT=1 node scripts/warehouse-r2-direct-write-audit.mjs

      - name: Cronograma Gmail attachment contract tests
        run: npm run test:cronograma-email

      - name: Cronograma sent-history and NF-week tests
        run: node --test scripts/cronograma-tracking.test.mjs

      - name: EMPROVEX core operational protection
        run: npm run verify:emprovex-core-protection

      - name: Recovery tests
        run: npm run test:recovery

      - name: Legacy runtime guard
        run: npm run audit:legacy-runtime

      - name: CI LEAN R2 G01 — 17 historical guards
        run: node scripts/ci-lean-guards.mjs --group G01

      - name: External Drive OAuth behavior tests
        run: npm run test:external-drive-auth

      - name: External Drive OAuth Firebase Auth emulator tests
        run: npm run test:external-drive-auth-emulator

      - name: Sector lifecycle guard
        run: npm run verify:sector-lifecycle

      - name: Multi-tenant security suite guard
        run: npm run verify:multitenant-security

      - name: Multi-tenant Firestore security tests
        run: npm run test:security:multitenant

      - name: ADM Depósito Phase 0 isolation guard
        run: npm run verify:adm-deposito-phase-0

      - name: Central de Depósitos external workspace security
        run: npm run test:central-depositos-external-security

      - name: ADM Depósito Phase 1 material contract tests
        run: npm run test:adm-deposito-material

      - name: ADM Depósito Phase 1 material foundation guard
        run: npm run verify:adm-deposito-phase-1

      - name: ADM Depósito Phase 2 ledger contract tests
        run: npm run test:adm-deposito-ledger
      - name: Warehouse server generic ledger security guard
        run: node --test scripts/warehouse-server-command-security.test.mjs

      - name: ADM Depósito Phase 2 ledger and balance guard
        run: npm run verify:adm-deposito-phase-2

      - name: ADM Depósito Phase 3 walking skeleton structural tests
        run: npm run test:adm-deposito-walking-skeleton

      - name: ADM Depósito Phase 3 walking skeleton guard
        run: npm run verify:adm-deposito-phase-3

      - name: ADM Depósito Phase 4 NF → estoque domain tests
        run: npm run test:adm-deposito-nf-stock

      - name: ADM Depósito Phase 4 NF → estoque guard
        run: npm run verify:adm-deposito-phase-4

      - name: ADM Depósito Phase 5 SISCOFIS domain tests
        run: npm run test:adm-deposito-siscofis

      - name: ADM Depósito Phase 5 SISCOFIS guard
        run: npm run verify:adm-deposito-phase-5

      - name: ADM Depósito Phase 6 locations and transfers domain tests
        run: npm run test:adm-deposito-locations

      - name: ADM Depósito Phase 6 permanent guard
        run: npm run verify:adm-deposito-phase-6

      - name: ADM Depósito Phase 7 stock lots FEFO domain tests
        run: npm run test:adm-deposito-stock-operational

      - name: ADM Depósito Phase 7 permanent guard
