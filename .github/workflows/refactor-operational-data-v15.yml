name: Temporary operational data refactor v15

on:
  push:
    branches:
      - refactor/operational-data-final-v15

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/operational-data-final-v15
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture TypeScript baseline
        shell: bash
        run: |
          (npx tsc --noEmit --pretty false || true) \
            | sed -E 's/\([0-9]+,[0-9]+\)/(L,C)/g' \
            | sed -E 's/"success" \| "error" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"success" \| "info" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"error" \| "success" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "success" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "error" \| "success"/"error" | "info" | "success"/g' \
            | sort -u > /tmp/ts-baseline.txt
      - name: Apply final operational refactor
        run: node scripts/refactor-operational-data-v15.mjs
      - name: Verify no new TypeScript errors
        shell: bash
        run: |
          (npx tsc --noEmit --pretty false || true) \
            | sed -E 's/\([0-9]+,[0-9]+\)/(L,C)/g' \
            | sed -E 's/"success" \| "error" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"success" \| "info" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"error" \| "success" \| "info"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "success" \| "error"/"error" | "info" | "success"/g' \
            | sed -E 's/"info" \| "error" \| "success"/"error" | "info" | "success"/g' \
            | sort -u > /tmp/ts-after.txt
          echo '=== NEW TYPESCRIPT ERRORS ==='
          comm -13 /tmp/ts-baseline.txt /tmp/ts-after.txt | tee /tmp/ts-new.txt
          test ! -s /tmp/ts-new.txt
      - name: Production build
        run: npm run build
      - name: Recovery tests
        run: npm run test:recovery
      - name: Diff hygiene
        run: git diff --check
      - name: Architecture guardrail
        shell: bash
        run: |
          test "$(wc -l < app/page.tsx)" -lt 600
          ! grep -q "onAuthStateChanged" app/page.tsx
          ! grep -q "onSnapshot" app/page.tsx
          test -f hooks/useOperationalData.ts
      - name: Remove temporary tooling
        run: |
          rm -f scripts/refactor-operational-data-v15.mjs
          rm -f .github/workflows/refactor-operational-data-v15.yml
      - name: Commit validated final refactor
        shell: bash
        run: |
          git config user.name "Moriark"
          git config user.email "marcoa.r.aquino@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: isola camada operacional e finaliza modularizacao"
          git push origin HEAD:refactor/operational-data-final-v15
