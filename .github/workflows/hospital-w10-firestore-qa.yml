name: Hospital W10 - Firestore Emulator QA (no production)
on:
  push:
    branches: [feat/cozinha-dietetica-w10-firestore-operacional]
  pull_request:
    branches: [feat/cozinha-dietetica-firebase-isolado-r1]
permissions:
  contents: read
jobs:
  hospital-w10:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOSPITAL_FIRESTORE_QA_ENABLED: '1'
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reproducible install without postinstall side effects
        run: npm ci --ignore-scripts
      - name: Native Firestore + Auth emulator transactions (strictly fictional)
        run: >
          npx --yes firebase-tools emulators:exec
          --project demo-cozinha-dietetica
          --config firebase.hospital-w10-test.json
          --only auth,firestore
          "node --test tests/hospital/firebase/firestore-store-emulator.test.mjs tests/hospital/firebase/w10-emulator-operational-e2e.test.mjs"
      - name: Typecheck
        run: npm run typecheck
      - name: Build without hospital credentials
        run: npm run build
      - name: PWA portal and protected route checks
        run: npm run test:pwa-installability
      - name: Firebase token and gateway unit tests
        run: node --test tests/hospital/firebase/firestore-gateway.test.mjs tests/hospital/firebase/identity.test.mjs
      - name: W0-W9 functional regression (SQLite fixture only)
        run: >
          node --test
          tests/hospital/core/*.test.mjs
          tests/hospital/entry/*.test.mjs
          tests/hospital/patients/*.test.mjs
          tests/hospital/maps/*.test.mjs
          tests/hospital/production/*.test.mjs
          tests/hospital/distribution/*.test.mjs
          tests/hospital/nutrition-audit/*.test.mjs
          tests/hospital/administration/*.test.mjs
          tests/hospital/reporting/*.test.mjs
          tests/hospital/e2e/*.test.mjs
      - name: Core protection
        run: npm run verify:emprovex-core-protection
      - name: EMPROVEX operations regression
        run: >
          node --experimental-vm-modules --test
          scripts/critical-cross-route-navigation.test.mjs
          scripts/warehouse-ledger-contract.test.mjs
          scripts/saas-r1-billing.test.mjs
          scripts/invoice-identity.test.mjs
