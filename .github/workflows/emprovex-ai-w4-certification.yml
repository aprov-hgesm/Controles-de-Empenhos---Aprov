name: EMPROVEX AI W4 isolated certification
on:
  pull_request:
    paths:
      - 'lib/emprovex-ai/context/**'
      - 'scripts/emprovex-ai-w4*'
      - '.github/workflows/emprovex-ai-w4-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout actual W3 PR contract (separate, never merged)
        uses: actions/checkout@v4
        with:
          ref: feat/emprovex-ai-r0-w3-query-core
          path: .w3-reference
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Compile W4 without relying on W3 branch
        run: |
          npx --no-install tsc lib/emprovex-ai/context/index.ts --module commonjs --moduleResolution node --target es2022 --skipLibCheck --esModuleInterop --outDir .w4-dist
          cp .w4-dist/index.js .w4-dist/index.cjs
      - name: Adversarial, integration and W3 contract parity
        run: W4_REQUIRE_W3=1 node --test scripts/emprovex-ai-w4.test.mjs
      - name: Versioned 520-case corpus (360 dev / 160 holdout)
        run: node scripts/emprovex-ai-w4-evaluate.mjs
      - name: Isolated CPU latency and memory measurement
        run: node scripts/emprovex-ai-w4-benchmark.mjs
