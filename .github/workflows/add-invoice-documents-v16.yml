name: Add invoice PDF documents v16

on:
  push:
    branches:
      - feature/invoice-pdf-documents-v16

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript baseline
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/ts-before.txt 2>&1 || true
          cat /tmp/ts-before.txt

      - name: Apply invoice PDF documents feature
        run: python3 scripts/add-invoice-documents-v16.py

      - name: Verify no new TypeScript errors
        shell: bash
        run: |
          npx tsc --noEmit > /tmp/ts-after.txt 2>&1 || true
          cat /tmp/ts-after.txt
          if ! diff -u /tmp/ts-before.txt /tmp/ts-after.txt; then
            echo 'TypeScript diagnostics changed. Refusing automatic publication.'
            exit 1
          fi

      - name: Recovery tests
        run: npm run test:recovery

      - name: Production build
        run: npm run build

      - name: Feature guardrails
        shell: bash
        run: |
          test -f components/InvoiceDocumentActions.tsx
          test -f lib/invoiceDocuments.ts
          test -f lib/server/invoiceDocumentSecurity.ts
          test -f app/api/invoice-documents/route.ts
          test -f app/api/invoice-documents/upload/route.ts
          grep -q 'notaFiscalPdf' lib/types.ts
          grep -q 'Documento — Nota Fiscal' features/notas-fiscais/components/NotasFiscaisView.tsx
          grep -q 'Documento — Nota de Empenho' components/EmpenhoDocumentActions.tsx
          grep -q 'handleInvoiceDocumentUploaded' app/page.tsx
          grep -q "access: 'private'" lib/invoiceDocuments.ts
          grep -q 'MAX_INVOICE_PDF_BYTES' app/api/invoice-documents/route.ts
          git diff --check

      - name: Remove temporary tooling
        shell: bash
        run: |
          rm -f scripts/add-invoice-documents-v16.py
          rm -f .github/workflows/add-invoice-documents-v16.yml
          git diff --check

      - name: Commit validated feature
        shell: bash
        run: |
          git config user.name 'Moriark'
          git config user.email 'marcoa.r.aquino@gmail.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'feat: adiciona PDFs privados às notas fiscais'
          git push origin HEAD:feature/invoice-pdf-documents-v16
