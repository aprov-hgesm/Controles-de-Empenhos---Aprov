name: Warehouse Server R2 Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/server/warehouse*.ts'
      - 'lib/warehouse/*Repository.ts'
      - 'lib/warehouse/serverCommandClient.ts'
      - 'app/api/central-depositos/**'
      - 'scripts/warehouse-server-manual-entry-emulator.ts'
      - 'scripts/warehouse-read-r1-emulator.ts'
      - 'scripts/warehouse-bulk-stock-r1.test.ts'
      - 'scripts/warehouse-bulk-location-alias-r1.test.ts'
      - 'lib/warehouse/bulkStockLocationMatcher.ts'
      - 'lib/server/warehouseBulkStockWorkbook.ts'
      - 'features/warehouse/components/WarehouseBulkManualEntryOperational.tsx'
      - 'lib/warehouse/queueReadClient.ts'
      - 'lib/warehouse/queueReadContracts.ts'
      - 'lib/server/warehouseQueueRead*.ts'
      - 'scripts/warehouse-manual-entry-atomic-security.test.mjs'
      - 'firebase.warehouse-security-test.json'
      - 'firebase.warehouse-server-only-test.json'
      - 'scripts/warehouse-server-only-rules.test.mjs'
      - 'firestore.warehouse*.rules'
      - '.github/workflows/warehouse-server-r2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-r2-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-r2-firestore:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false || github.head_ref == 'feat/warehouse-croqui-unified-structure-20261023' }}
    name: Auth + Firestore Server R2 Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Server R2 smoke (demo project only)
        run: npx --yes firebase-tools emulators:exec --config firebase.warehouse-security-test.json --project demo-emprovex-security --only auth,firestore "npx --yes tsx scripts/warehouse-server-manual-entry-emulator.ts"
      - name: Warehouse Bulk Stock — Excel parser and template guards
        run: npx --yes tsx scripts/warehouse-bulk-stock-r1.test.ts
      - name: Warehouse Bulk Stock — existing depot location aliases
        run: npx --yes tsx scripts/warehouse-bulk-location-alias-r1.test.ts
      - name: Warehouse Read R1 — server queue against emulator
        run: npx --yes firebase-tools emulators:exec --config firebase.warehouse-security-test.json --project demo-emprovex-security --only auth,firestore "npx --yes tsx scripts/warehouse-read-r1-emulator.ts"
      - name: Read-only Rules, tenant isolation and suspension (emulator)
        run: npx --yes firebase-tools emulators:exec --config firebase.warehouse-server-only-test.json --project demo-emprovex-security --only auth,firestore "node scripts/warehouse-server-only-rules.test.mjs"
