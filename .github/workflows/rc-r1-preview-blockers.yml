name: RC R1 Preview Blockers Regression
on:
  push:
    branches: [rc-r1-preview-blockers-fix-01, rc-r1-preview-firebase-isolation-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/firebase-preview-isolation.test.mjs scripts/warehouse-f05-route-transaction.test.mjs scripts/warehouse-fast-intake-errors.test.mjs
      - name: Preview without environment must fail before compilation
        shell: bash
        run: |
          if VERCEL_ENV=preview node node_modules/next/dist/bin/next build > /tmp/preview-preflight.txt 2>&1; then
            echo 'Expected Preview build refusal'; exit 1
          fi
          rg -q 'FIREBASE_PREVIEW_ISOLATION_REQUIRED' /tmp/preview-preflight.txt
  sidebar-logout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Four viewports with isolated synthetic sessions
        env:
          NEXT_PUBLIC_EMPROVEX_E2E_EMULATORS: '1'
          NEXT_PUBLIC_EMPROVEX_E2E_PROJECT_ID: demo-emprovex-security
        run: >
          npx --yes firebase-tools emulators:exec --config firebase.security-test.json
          --project demo-emprovex-security --only auth,firestore
          "node scripts/e2e-browser-emulator.mjs tests/e2e/rc-r1-sidebar-logout.spec.mjs"
